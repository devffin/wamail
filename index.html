<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WaMail</title>

<!-- FAVICON -->
<link rel="icon" type="image/png" href="logo.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#111;
color:white;
height:100vh;
display:flex;
transition:0.3s;
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:250px;
background:#1b1b1b;
padding:20px;
border-right:1px solid #333;
transition:0.3s;
overflow-y:auto;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:28px;
font-weight:bold;
margin-bottom:30px;
color:#4ea1ff;
}

.logo-img{
width:42px;
height:42px;
object-fit:contain;
}

.compose-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#4ea1ff;
color:white;
font-size:16px;
cursor:pointer;
margin-bottom:20px;
}

.menu-item{
padding:12px;
border-radius:10px;
cursor:pointer;
margin-bottom:8px;
transition:0.2s;
}

.menu-item:hover{
background:#2b2b2b;
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
padding:15px;
border-bottom:1px solid #333;
display:flex;
justify-content:space-between;
align-items:center;
background:#181818;
transition:0.3s;
}

.user{
font-size:14px;
opacity:0.8;
}

.mail-list{
flex:1;
overflow-y:auto;
}

.mail{
padding:18px;
border-bottom:1px solid #222;
cursor:pointer;
transition:0.2s;
}

.mail:hover{
background:#1d1d1d;
}

.mail-subject{
font-weight:bold;
margin-bottom:6px;
}

.mail-preview{
opacity:0.7;
font-size:14px;
}

/* =========================
MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
width:500px;
background:#1a1a1a;
padding:20px;
border-radius:14px;
display:flex;
flex-direction:column;
gap:12px;
transition:0.3s;
}

input, textarea{
background:#111;
border:1px solid #333;
padding:12px;
color:white;
border-radius:8px;
}

textarea{
height:200px;
resize:none;
}

.send-btn{
background:#4ea1ff;
border:none;
padding:12px;
color:white;
border-radius:8px;
cursor:pointer;
}

/* =========================
AUTH
========================= */

.auth{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#0d0d0d;
}

.auth-box{
background:#1a1a1a;
padding:30px;
border-radius:18px;
width:350px;
display:flex;
flex-direction:column;
gap:12px;
transition:0.3s;
}

.auth-title{
font-size:28px;
font-weight:bold;
text-align:center;
margin-bottom:10px;
}

.auth-btn{
padding:12px;
border:none;
border-radius:10px;
background:#4ea1ff;
color:white;
cursor:pointer;
}

.switch{
text-align:center;
font-size:14px;
opacity:0.7;
cursor:pointer;
}

/* =========================
TOP BUTTONS
========================= */

.top-btn{
padding:10px 14px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2a2a2a;
color:white;
transition:0.2s;
}

.top-btn:hover{
opacity:0.8;
}

.logout{
background:#ff4e4e;
}

/* =========================
LIGHT THEME
========================= */

body.light{
background:#f4f4f4;
color:#111;
}

body.light .sidebar{
background:white;
border-right:1px solid #ddd;
}

body.light .topbar{
background:white;
border-bottom:1px solid #ddd;
}

body.light .mail{
border-bottom:1px solid #ddd;
}

body.light .mail:hover{
background:#ececec;
}

body.light .modal-content,
body.light .auth-box{
background:white;
color:black;
}

body.light input,
body.light textarea{
background:#f1f1f1;
color:black;
border:1px solid #ccc;
}

body.light .menu-item:hover{
background:#ececec;
}

body.light .top-btn{
background:#ddd;
color:black;
}

/* =========================
RED SECRET THEME
========================= */

body.red-theme{
background:#2b0000;
color:white;
}

body.red-theme .sidebar{
background:#3a0000;
border-right:1px solid #700;
}

body.red-theme .topbar{
background:#400000;
border-bottom:1px solid #700;
}

body.red-theme .compose-btn,
body.red-theme .send-btn{
background:#ff2e2e;
}

body.red-theme .logo{
color:#ff4e4e;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:700px){

.sidebar{
display:none;
}

.modal-content{
width:95%;
}

}
</style>
</head>
<body>

<!-- AUTH -->

<div class="auth" id="authScreen">

  <div class="auth-box">

    <div class="auth-title">
      Bienvenue sur WaMail
    </div>

    <input type="email" id="email" placeholder="Adresse mail">

    <input type="password" id="password" placeholder="Mot de passe">

    <button class="auth-btn" id="authBtn">
      Connexion
    </button>

    <div class="switch" id="switchMode">
      Pas encore de compte ? Inscription
    </div>

  </div>

</div>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    <img src="logo.png" class="logo-img">
    <span>WaMail</span>
  </div>

  <button class="compose-btn" id="composeBtn">
    Nouveau message
  </button>

  <div class="menu-item" onclick="openFolder('inbox')">
    📥 Réception
  </div>

  <div class="menu-item" onclick="openFolder('sent')">
    📤 Envoyés
  </div>

  <div class="menu-item" onclick="openFolder('spam')">
    🚫 Spam
  </div>

  <div id="customFolders"></div>

  <div class="menu-item" onclick="createFolder()">
    ➕ Nouveau dossier
  </div>

</div>

<!-- MAIN -->

<div class="main">

  <div class="topbar">

    <div id="folderTitle">
      Boîte de réception
    </div>

    <div style="display:flex; gap:10px; align-items:center;">

      <button id="themeBtn" class="top-btn">
        🌙
      </button>

      <button id="notifBtn" class="top-btn">
        🔔
      </button>

      <div class="user" id="currentUser"></div>

      <button id="logoutBtn" class="top-btn logout">
        Déconnexion
      </button>

    </div>

  </div>

  <div class="mail-list" id="mailList"></div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-content">

    <input type="email" id="receiver" placeholder="Destinataire">

    <input type="text" id="subject" placeholder="Sujet">

    <textarea id="content" placeholder="Votre message..."></textarea>

    <button class="send-btn" id="sendBtn">
      Envoyer
    </button>

  </div>

</div>

<!-- SON NOTIF -->
<audio id="notifSound" src="notification.mp3"></audio>

<script>

// =========================
// SUPABASE
// =========================

const SUPABASE_URL =
"https://hulbzibpjpycbasuxuqs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DRqj6_oPdng5N5i5hUNOCg_Bf8zHKYr";

const client =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// =========================

let isLogin = true;
let currentUser = null;
let currentFolder = "inbox";
let knownMessages = 0;

// =========================
// ELEMENTS
// =========================

const authScreen =
document.getElementById("authScreen");

const authBtn =
document.getElementById("authBtn");

const switchMode =
document.getElementById("switchMode");

const mailList =
document.getElementById("mailList");

const currentUserText =
document.getElementById("currentUser");

const modal =
document.getElementById("modal");

const themeBtn =
document.getElementById("themeBtn");

// =========================
// LOGIN / REGISTER
// =========================

switchMode.onclick = () => {

  isLogin = !isLogin;

  authBtn.innerText =
  isLogin
  ? "Connexion"
  : "Inscription";

  switchMode.innerText =
  isLogin
  ? "Pas encore de compte ? Inscription"
  : "Déjà un compte ? Connexion";

};

authBtn.onclick = async () => {

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  if(isLogin){

    const { error } =
    await client.auth.signInWithPassword({
      email,
      password
    });

    if(error){
      alert(error.message);
    }

  }else{

    const { error } =
    await client.auth.signUp({
      email,
      password
    });

    if(error){
      alert(error.message);
    }else{
      alert("Compte créé !");
    }

  }

};

// =========================
// AUTH STATE
// =========================

client.auth.onAuthStateChange(
async (event, session) => {

  if(session){

    currentUser = session.user;

    authScreen.style.display = "none";

    currentUserText.innerText =
    currentUser.email;

    loadMessages();

    checkNotifications();

  }else{

    authScreen.style.display = "flex";

  }

});

// =========================
// LOAD MESSAGES
// =========================

async function loadMessages(){

  if(!currentUser) return;

  let query = client
  .from("messages")
  .select("*")
  .order("created_at", {
    ascending:false
  });

  if(currentFolder === "inbox"){

    query =
    query.eq(
      "receiver",
      currentUser.email
    );

  }

  else if(currentFolder === "sent"){

    query =
    query.eq(
      "sender",
      currentUser.email
    );

  }

  else if(currentFolder === "spam"){

    query =
    query.eq(
      "folder",
      "spam"
    );

  }

  else{

    query =
    query.eq(
      "folder",
      currentFolder
    );

  }

  const { data } = await query;

  mailList.innerHTML = "";

  if(!data) return;

  data.forEach(mail => {

    const div =
    document.createElement("div");

    div.className = "mail";

    div.innerHTML = `
      <div class="mail-subject">
        ${mail.subject || "Sans sujet"}
      </div>

      <div>
        De : ${mail.sender}
      </div>

      <div class="mail-preview">
        ${mail.content.slice(0,100)}
      </div>
    `;

    div.onclick = () => {

      alert(
        "Sujet : " + mail.subject +
        "\\n\\nDe : " + mail.sender +
        "\\n\\n" + mail.content
      );

    };

    mailList.appendChild(div);

  });

}

// =========================
// FOLDERS
// =========================

function openFolder(folder){

  currentFolder = folder;

  document.getElementById(
    "folderTitle"
  ).innerText = folder;

  loadMessages();

}

let folders =
JSON.parse(
localStorage.getItem("folders")
) || [];

function renderFolders(){

  const container =
  document.getElementById(
    "customFolders"
  );

  container.innerHTML = "";

  folders.forEach(folder => {

    const div =
    document.createElement("div");

    div.className = "menu-item";

    div.innerHTML = `
      📁 ${folder}
      <span style="float:right;color:red;">
        ✖
      </span>
    `;

    div.onclick = () => {

      openFolder(folder);

    };

    div.querySelector("span")
    .onclick = (e) => {

      e.stopPropagation();

      folders =
      folders.filter(
        f => f !== folder
      );

      localStorage.setItem(
        "folders",
        JSON.stringify(folders)
      );

      renderFolders();

    };

    container.appendChild(div);

  });

}

function createFolder(){

  const name =
  prompt("Nom du dossier");

  if(!name) return;

  folders.push(name);

  localStorage.setItem(
    "folders",
    JSON.stringify(folders)
  );

  renderFolders();

}

renderFolders();

// =========================
// MODAL
// =========================

document.getElementById(
"composeBtn"
).onclick = () => {

  modal.style.display = "flex";

};

modal.onclick = (e) => {

  if(e.target === modal){

    modal.style.display = "none";

  }

};

// =========================
// SEND MESSAGE
// =========================

document.getElementById(
"sendBtn"
).onclick = async () => {

  const receiver =
  document.getElementById("receiver").value;

  const subject =
  document.getElementById("subject").value;

  const content =
  document.getElementById("content").value;

  if(!receiver || !content){

    alert("Message incomplet");

    return;

  }

  const { error } =
  await client
  .from("messages")
  .insert({

    sender: currentUser.email,
    receiver,
    subject,
    content,
    folder:"inbox"

  });

  if(error){

    alert(error.message);

  }else{

    alert("Message envoyé !");

    modal.style.display = "none";

    document.getElementById(
    "receiver"
    ).value = "";

    document.getElementById(
    "subject"
    ).value = "";

    document.getElementById(
    "content"
    ).value = "";

    loadMessages();

  }

};

// =========================
// LOGOUT
// =========================

document.getElementById(
"logoutBtn"
).onclick = async () => {

  await client.auth.signOut();

  currentUser = null;

  authScreen.style.display = "flex";

  currentUserText.innerText = "";

  mailList.innerHTML = "";

};

// =========================
// THEME
// =========================

let darkMode =
localStorage.getItem("theme")
!== "light";

function updateTheme(){

  if(darkMode){

    document.body.classList.remove(
      "light"
    );

    themeBtn.innerText = "🌙";

  }else{

    document.body.classList.add(
      "light"
    );

    themeBtn.innerText = "☀️";

  }

  localStorage.setItem(
    "theme",
    darkMode ? "dark" : "light"
  );

}

updateTheme();

themeBtn.onclick = () => {

  darkMode = !darkMode;

  updateTheme();

};

// =========================
// SECRET RED THEME
// =========================

let typedKeys = "";

document.addEventListener(
"keydown",
(e) => {

  typedKeys +=
  e.key.toLowerCase();

  if(typedKeys.length > 20){

    typedKeys =
    typedKeys.slice(-20);

  }

  if(
    typedKeys.includes("wared")
  ){

    document.body.classList.toggle(
      "red-theme"
    );

    if(
      Notification.permission
      === "granted"
    ){

      new Notification(
        "❤️ Mode soutien activé"
      );

    }

    typedKeys = "";

  }

});

// =========================
// NOTIFICATIONS
// =========================

document.getElementById(
"notifBtn"
).onclick = async () => {

  const permission =
  await Notification
  .requestPermission();

  if(permission === "granted"){

    alert(
      "Notifications activées !"
    );

  }

};

async function checkNotifications(){

  if(!currentUser) return;

  const { data } =
  await client
  .from("messages")
  .select("*")
  .eq(
    "receiver",
    currentUser.email
  );

  if(!data) return;

  if(
    knownMessages !== 0 &&
    data.length > knownMessages
  ){

    const latest =
    data[data.length - 1];

    if(
      Notification.permission
      === "granted"
    ){

      document
      .getElementById(
        "notifSound"
      )
      .play();

      new Notification(
        "Nouveau message",
        {
          body:
          latest.sender +
          " : " +
          latest.subject
        }
      );

    }

  }

  knownMessages = data.length;

}

// =========================
// AUTO REFRESH
// =========================

setInterval(
loadMessages,
3000
);

setInterval(
checkNotifications,
3000
);

</script>

</body>
</html>
