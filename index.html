<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>devffin — en maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3f4f1;
    --paper-2:#eceee9;
    --ink:#15181a;
    --ink-soft:#54595c;
    --line:#d9dbd4;
    --accent:#0e6b66;
    --accent-soft:#e3ece9;
    --accent-2:#c1762f;
    --display: 'Space Grotesk', sans-serif;
    --sans: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s;}
  a:hover{border-color:var(--accent);}
  a:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  .card{
    max-width:520px;
    width:100%;
    text-align:center;
  }

  .logo{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--display); font-weight:700; font-size:1.05rem;
    margin-bottom:56px;
  }
  .logo .dot{width:8px; height:8px; background:var(--accent); border-radius:1px; display:inline-block;}

  .status-line{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:.76rem; text-transform:uppercase;
    letter-spacing:.1em; color:var(--accent-2);
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 14px;
    margin-bottom:28px;
  }
  .status-line .pulse{
    width:7px; height:7px; border-radius:50%;
    background:var(--accent-2);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(.7);}
  }

  h1{
    font-family:var(--display); font-weight:700;
    font-size:clamp(2rem, 6vw, 2.8rem);
    letter-spacing:-0.02em; line-height:1.05;
    margin:0 0 18px;
  }

  p.lede{
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:40ch;
    margin:0 auto 40px;
  }

  .meta{
    font-family:var(--mono);
    font-size:.78rem;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:24px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .meta .row{display:flex; justify-content:space-between; gap:12px;}
  .meta .row b{color:var(--ink); font-weight:500;}

  .contact{
    margin-top:32px;
    font-size:.92rem;
    color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .pulse{animation:none;}
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo"><span class="dot"></span>devffin</div>

    <div class="status-line"><span class="pulse"></span>Maintenance en cours</div>

    <h1>On répare le moteur.</h1>
    <p class="lede">Le site est temporairement hors ligne le temps d'une intervention technique. Il sera de retour très bientôt.</p>

    <div class="meta">
      <div class="row"><span>Début</span><b id="start-time">—</b></div>
      <div class="row"><span>Retour estimé</span><b>Sous peu</b></div>
      <div class="row"><span>Statut</span><b>En cours</b></div>
    </div>

    <p class="contact">Une urgence&nbsp;? Écris à <a href="mailto:contact@devffin.dev">contact@devffin.dev</a></p>
  </div>

<script>
  document.getElementById('start-time').textContent =
    new Date().toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
</script>

</body>
</html>
